name: Deploy to GitHub Pages

on:
  # Only a version tag publishes the site. Pushing to main does NOT deploy.
  push:
    tags: ['v*']
  workflow_dispatch:      # manual re-run; deploys whatever ref you pick (use a tag)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/
          echo "${GITHUB_REF_NAME} ($(git rev-parse --short HEAD))" > _site/version.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
